<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarketMind - Stock Trend Predictor</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #f4f7f9;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .container {
            width: 600px;
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h1 {
            font-size: 2em;
            margin-bottom: 20px;
            color: #333;
        }
        input[type="text"] {
            width: 100%;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 1em;
        }
        button {
            width: 100%;
            padding: 15px;
            background-color: #007bff;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 1.1em;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result {
            margin-top: 30px;
            text-align: left;
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #ddd;
        }
        .result h3, .result h4 {
            margin-bottom: 10px;
            color: #333;
        }
        .result pre {
            background-color: #eee;
            padding: 15px;
            border-radius: 10px;
            font-family: monospace;
            overflow-x: auto;
        }
        .error {
            color: #ff4d4d;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 MarketMind</h1>
        <form action="/analyze" method="POST">
            <input type="text" name="stock_name" placeholder="Enter Stock Name (e.g., INFY, RELIANCE)" required>
            <button type="submit">Analyze</button>
        </form>
        {% if error %}
            <div class="error">⚠️ {{ error }}</div>
        {% endif %}
        {% if sentiment_label %}
            <div class="result">
                <h3>🔍 Stock Analysis for: {{ stock_name | upper }}</h3>
                <p><strong>📈 Predicted Trend:</strong> {{ sentiment_label }}</p>
                <p><strong>💡 Market Sentiment:</strong> {{ market_sentiment }}</p>
                <h4>📋 Detailed Classification Report:</h4>
                <pre>{{ classification_report }}</pre>
            </div>
        {% endif %}
    </div>
</body>
</html>
